name: Deploy Lotto Admin to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Test, Build JAR, Push ACR & Rollout AKS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # bootJar가 frontend npm install/build를 함께 실행 (Vite 8 → Node 22)
      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 4. Test & Build JAR (실패 시 배포 중단)
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean test bootJar --console=plain

      # Dockerfile은 컨텍스트 루트의 *.jar만 복사하므로 JAR와 Dockerfile만 담는다
      - name: 5. Prepare Docker Build Context
        run: |
          rm -rf dist && mkdir -p dist
          cp backend/build/libs/*-SNAPSHOT.jar Dockerfile dist/
          ls -la dist

      - name: 6. Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 7. Log in to ACR
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: 8. Build and Push Image (:latest + :commit SHA)
        run: |
          IMAGE="${{ secrets.AZURE_ACR_NAME }}.azurecr.io/lotto-admin"
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} dist
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: 9. Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

      - name: 10. Rollout Restart (lotto-admin)
        run: |
          kubectl rollout restart deployment/lotto-admin -n mzc-apps
          kubectl rollout status deployment/lotto-admin -n mzc-apps --timeout=180s
